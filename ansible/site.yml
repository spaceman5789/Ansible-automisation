---
- name: Bootstrap single VM (nginx + app + ssl)
  hosts: web
  become: true

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - nginx
          - ufw
          - git
          - openssl
          - certbot
          - python3-certbot-nginx
          - docker.io
          - docker-compose
        state: present

    - name: Ensure docker service is enabled and started
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        create_home: true
        groups: docker
        append: true

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    - name: Checkout application code
      ansible.builtin.git:
        repo: "{{ app_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ app_version }}"
        update: true
      become_user: "{{ deploy_user }}"

    - name: Render systemd unit for app
      ansible.builtin.template:
        src: app.service.j2
        dest: "/etc/systemd/system/{{ app_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - daemon reload
        - restart app

    - name: Enable and start app service
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        enabled: true
        state: started

    - name: Configure UFW defaults
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }

    - name: Open SSH, HTTP, HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
      loop:
        - "22"
        - "80"
        - "443"

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    - name: Check existing Let's Encrypt cert
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
      register: letsencrypt_cert
      when: ssl_mode == 'letsencrypt'

    - name: Create self-signed certificate
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -nodes -newkey rsa:2048
          -keyout /etc/ssl/private/{{ domain_name }}.key
          -out /etc/ssl/certs/{{ domain_name }}.crt
          -days 365
          -subj "/CN={{ domain_name }}"
      args:
        creates: "/etc/ssl/certs/{{ domain_name }}.crt"
      when: ssl_mode == 'selfsigned'

    - name: Render nginx config
      ansible.builtin.template:
        src: nginx-app.conf.j2
        dest: /etc/nginx/sites-available/app.conf
        owner: root
        group: root
        mode: "0644"
      notify: reload nginx

    - name: Enable nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/app.conf
        dest: /etc/nginx/sites-enabled/app.conf
        state: link
      notify: reload nginx

    - name: Disable default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: reload nginx

    - name: Ensure nginx is enabled and started
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    - name: Request Let's Encrypt certificate
      ansible.builtin.command:
        cmd: >-
          certbot --nginx
          -d {{ domain_name }}
          --non-interactive
          --agree-tos
          -m {{ letsencrypt_email }}
          --redirect
      when:
        - ssl_mode == 'letsencrypt'
        - not letsencrypt_cert.stat.exists
      notify: reload nginx

  handlers:
    - name: daemon reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart app
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        state: restarted

    - name: reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
